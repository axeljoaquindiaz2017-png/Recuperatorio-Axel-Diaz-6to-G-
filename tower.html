<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Jugando Icy Tower | IPET Nº 249</title>
  <link rel="icon" href="escudo-ipet249.png">
  <link rel="stylesheet" href="tower.css">
</head>
<body>
  <header class="top">
    <img src="escudo-ipet249.png" alt="Escudo del IPET Nº 249">
    <div>
      <strong>IPET Nº 249 “Nicolás Copérnico”</strong>
      <span>Laboratorio de Programación · 6º G · Informática</span>
    </div>
    <a href="index.html" class="link-inicio">Inicio</a>
  </header>

  <main class="torre-contenedor">
    <div class="hud">
      <div><span>PISO</span><strong id="hud-piso">0</strong></div>
      <div><span>PUNTOS</span><strong id="hud-puntos">0</strong></div>
      <div><span>RITMO</span><strong id="hud-ritmo">1.0x</strong></div>
    </div>

    <div id="aviso-hito" class="aviso-hito oculto"></div>

    <canvas id="gameCanvas" width="420" height="540"></canvas>

    <div class="controles-movil" aria-label="Controles táctiles">
      <button type="button" id="btn-izq" class="btn-control">◀</button>
      <button type="button" id="btn-der" class="btn-control">▶</button>
      <button type="button" id="btn-salto" class="btn-control btn-salto">SALTAR ▲</button>
    </div>

    <div id="modal-fin" class="modal-fin oculto">
      <h2>¡Fin de la partida!</h2>
      <p id="texto-resultado"></p>
      <button type="button" id="btn-reintentar" class="btn-reintentar">Jugar de nuevo</button>
    </div>
  </main>

  <script src="tower.js"></script>
</body>
</html>
